name: Build & Test (CPU only)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            gcc \
            g++ \
            python3 \
            python3-dev \
            python3-pip \
            libfmt-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DHWS_ENABLE_CPU_SAMPLING=ON \
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_AMD_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=OFF \
                -DHWS_ENABLE_PYTHON_BINDINGS=ON \
                -DHWS_ENABLE_ERROR_CHECKS=OFF \
                -DHWS_ENABLE_TESTING=ON \
                ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Run Python bindings smoke check
        run: |
          cd build
          python3 -c "import sys; sys.path.insert(0, 'bindings'); import HardwareSampling"

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error


  build-test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Install dependencies
        run: |
          brew install fmt pybind11 python

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DHWS_ENABLE_CPU_SAMPLING=AUTO \
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_AMD_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=OFF \
                -DHWS_ENABLE_PYTHON_BINDINGS=ON \
                -DHWS_ENABLE_ERROR_CHECKS=OFF \
                -DHWS_ENABLE_TESTING=ON \
                ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error

# build-test-windows is intentionally not running right now: ctest hangs indefinitely (confirmed past both a 30s
# and a 120s timeout, with zero test output captured either time - not even doctest's own startup banner or a
# stderr marker placed before main()) while running hws_test_detail.exe. Every Windows run's log shows
# "Terminate orphan process: pid (...) (vctip)" at cleanup - vctip.exe is MSVC's telemetry uploader, and the
# working theory is that it inherits the test process's stdout/stderr handles and outlives it, so ctest blocks
# forever waiting for those pipes to reach EOF. Setting VSCMD_SKIP_SENDTELEMETRY=1 to stop vctip.exe from being
# spawned did NOT fix it (still hung, still an orphaned vctip.exe in the log), so the exact mechanism remains
# unconfirmed. The compile-level Windows fixes (WINDOWS_EXPORT_ALL_SYMBOLS, the <ostream> include, the
# chrono_literals fix) are real and independent of this - configuring and building for Windows both work fine now,
# only running the test hangs. Re-enable this job once the ctest hang itself is understood/fixed.
