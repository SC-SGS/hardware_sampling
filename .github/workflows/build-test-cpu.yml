name: Build & Test (CPU only)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            gcc \
            g++ \
            python3 \
            python3-dev \
            python3-pip \
            libfmt-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DHWS_ENABLE_CPU_SAMPLING=ON \
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_AMD_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=OFF \
                -DHWS_ENABLE_PYTHON_BINDINGS=ON \
                -DHWS_ENABLE_ERROR_CHECKS=OFF \
                -DHWS_ENABLE_TESTING=ON \
                ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Run Python bindings smoke check
        run: |
          cd build
          python3 -c "import sys; sys.path.insert(0, 'bindings'); import HardwareSampling"

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error


  build-test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Install dependencies
        run: |
          brew install fmt pybind11 python

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DHWS_ENABLE_CPU_SAMPLING=AUTO \
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_AMD_SAMPLING=OFF \
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=OFF \
                -DHWS_ENABLE_PYTHON_BINDINGS=ON \
                -DHWS_ENABLE_ERROR_CHECKS=OFF \
                -DHWS_ENABLE_TESTING=ON \
                ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error


  build-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Setup Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install cmake

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug `
                -DHWS_ENABLE_CPU_SAMPLING=OFF `
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=OFF `
                -DHWS_ENABLE_GPU_AMD_SAMPLING=OFF `
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=OFF `
                -DHWS_ENABLE_PYTHON_BINDINGS=ON `
                -DHWS_ENABLE_ERROR_CHECKS=OFF `
                -DHWS_ENABLE_TESTING=ON `
                ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Debug

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error --build-config Debug
