name: CMake Configuration Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  cmake-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [Debug, Release]
        cpu-sampling: [ON, OFF, AUTO]
        nvidia-sampling: [ON, OFF, AUTO]
        amd-sampling: [ON, OFF, AUTO]
        intel-sampling: [ON, OFF, AUTO]
        python-bindings: [ON, OFF]
        error-checks: [ON, OFF]
        sampling-interval: [10, 100, 1000]
        exclude:
          - cpu-sampling: ON
            nvidia-sampling: ON
            amd-sampling: ON
            intel-sampling: ON
          - python-bindings: OFF
            error-checks: ON

    steps:
      - name: Checkout hws
        uses: actions/checkout@v4.2.0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libfmt-dev python3 python3-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
                -DHWS_ENABLE_CPU_SAMPLING=${{ matrix.cpu-sampling }} \
                -DHWS_ENABLE_GPU_NVIDIA_SAMPLING=${{ matrix.nvidia-sampling }} \
                -DHWS_ENABLE_GPU_AMD_SAMPLING=${{ matrix.amd-sampling }} \
                -DHWS_ENABLE_GPU_INTEL_SAMPLING=${{ matrix.intel-sampling }} \
                -DHWS_ENABLE_PYTHON_BINDINGS=${{ matrix.python-bindings }} \
                -DHWS_ENABLE_ERROR_CHECKS=${{ matrix.error-checks }} \
                -DHWS_SAMPLING_INTERVAL=${{ matrix.sampling-interval }}ms \
                ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Test build
        run: |
          cd build
          ctest -j$(nproc) --output-on-failure || true

      - name: Run example
        run: |
          cd build
          ctest -R example_cpp --output-on-failure || true
